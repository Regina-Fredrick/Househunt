<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Househunt{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0E1116;
            --paper: #F6F5F2;
            --accent: #C9A227;
            --danger: #C0392B;
            --gold: #FFC93C;
            --teal: #2EC4B6;
            --muted: #6B7280;
        }
        body {
            background: var(--paper);
            font-family: 'Inter', sans-serif;
            color: var(--ink);
        }
        h1, h2, h3, h4, h5, .fw-bold {
            font-family: 'Space Grotesk', sans-serif;
        }
        .navbar {
            background: var(--ink) !important;
        }
        .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }
        .btn-primary {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background: #A8871F !important;
            border-color: #A8871F !important;
        }
        .btn-success {
            background: var(--teal) !important;
            border-color: var(--teal) !important;
            font-weight: 600;
            border-radius: 8px;
        }
        .card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(14,17,22,0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border-top: 4px solid var(--accent);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(14,17,22,0.14);
        }
        .price-tag {
            display: inline-block;
            background: var(--gold);
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 6px;
            transform: rotate(-2deg);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .badge.bg-warning {
            background: var(--gold) !important;
            color: var(--ink) !important;
        }
        .badge.bg-success {
            background: var(--teal) !important;
        }
        .badge.bg-danger {
            background: var(--danger) !important;
        }
        a {
            color: var(--accent);
        }
        input[type=text], input[type=email], input[type=password], input[type=number], input[type=tel], textarea, select {
            display: block;
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            background: white;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(201,162,39,0.15);
        }
        label {
            font-weight: 500;
            margin-top: 8px;
            display: block;
        }
        .card-stat-gold { border-top-color: #C9A227 !important; }
.card-stat-orange { border-top-color: #F2994A !important; }
.card-stat-teal { border-top-color: #2EC4B6 !important; }
.card-stat-purple { border-top-color: #7C5CFC !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Househunt</a>
        <div>
            {% if user.is_authenticated %}
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'create_listing' %}">New Listing</a>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'my_listings' %}">My Listings</a>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'profile' %}">Profile</a>
            {% else %}
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Login</a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container">
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
