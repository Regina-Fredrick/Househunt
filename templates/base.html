<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Househunt{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1A1D29;
            --paper: #F8F9FB;
            --orange: #F2994A;
            --blue: #5B8DEF;
            --purple: #7C5CFC;
            --teal: #2ED9C3;
            --muted: #8B92A5;
            --danger: #E05263;
        }
        body {
            background: var(--paper);
            font-family: 'Inter', sans-serif;
            color: var(--ink);
        }
        h1, h2, h3, h4, h5, .fw-bold {
            font-family: 'Space Grotesk', sans-serif;
        }
        .navbar {
            background: white !important;
            border-bottom: 1px solid #EDEEF2;
        }
        .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            color: var(--ink) !important;
        }
        .navbar .btn-outline-light {
            color: var(--ink) !important;
            border-color: #E3E5EA !important;
        }
        .navbar .btn-outline-light:hover {
            background: var(--ink) !important;
            color: white !important;
        }
        .btn-primary {
            background: var(--purple) !important;
            border-color: var(--purple) !important;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background: #6A4CE0 !important;
            border-color: #6A4CE0 !important;
        }
        .btn-success {
            background: var(--teal) !important;
            border-color: var(--teal) !important;
            font-weight: 600;
            border-radius: 8px;
            color: var(--ink) !important;
        }
        .card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(26,29,41,0.06);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(26,29,41,0.10);
        }
        .price-tag {
            display: inline-block;
            background: #FFF4E8;
            color: var(--orange);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 8px;
        }
        .badge.bg-warning {
            background: #FFF4E8 !important;
            color: var(--orange) !important;
        }
        .badge.bg-success {
            background: #E6FBF8 !important;
            color: #1AA89A !important;
        }
        .badge.bg-danger {
            background: #FDECEE !important;
            color: var(--danger) !important;
        }
        a {
            color: var(--purple);
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            margin-bottom: 12px;
        }
        .stat-icon-orange { background: #FFF4E8; color: var(--orange); }
        .stat-icon-blue { background: #EAF1FE; color: var(--blue); }
        .stat-icon-purple { background: #F1EDFE; color: var(--purple); }
        .stat-icon-teal { background: #E6FBF8; color: #1AA89A; }
        input[type=text], input[type=email], input[type=password], input[type=number], input[type=tel], textarea, select {
            display: block;
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #E3E5EA;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            background: white;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
        }
        label {
            font-weight: 700;
            margin-top: 8px;
            display: block;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Househunt</a>
        <div>
            {% if user.is_authenticated %}
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'browse_listings' %}">Browse</a>
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'create_listing' %}">New Listing</a>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'my_listings' %}">My Listings</a>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'profile' %}">Profile</a>
                {% else %}
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'browse_listings' %}">Browse</a>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Login</a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container">
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
