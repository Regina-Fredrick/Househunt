{% extends 'base.html' %}
{% block content %}
<h2>Edit Listing</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <h3>Images</h3>
    {{ formset.management_form }}
    {% for image_form in formset %}
        {{ image_form.as_p }}
    {% endfor %}

    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
