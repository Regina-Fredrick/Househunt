{% extends 'base.html' %}
{% block content %}
<h2>Delete Listing</h2>
<p>Are you sure you want to delete <strong>{{ listing.title }}</strong>? This cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete it</button>
    <a href="{% url 'my_listings' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
