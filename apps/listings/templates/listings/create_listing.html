<h2>Create Listing</h2>

{% if messages %}
<ul>
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <h3>Images (upload 1-5)</h3>
    {{ formset.management_form }}
    {% for image_form in formset %}
        {{ image_form.as_p }}
    {% endfor %}

    <button type="submit">Submit Listing</button>
</form>
